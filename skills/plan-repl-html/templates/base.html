<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  plan-repl-html base scaffold.

  Replace every PLACEHOLDER value with the real one (title, task/phase,
  page-title, TL;DR). Keep the data-* attribute names and structure
  unchanged — only the values are placeholders. Don't touch the toolbar
  markup or the <script src> path either; the annotation widget loaded
  from .repl-assets/annotations.js depends on them. Phase-specific
  content goes inside <main>. Each annotatable section MUST have a
  stable, descriptive [data-annot-id].

  Shared CSS + JS live in .repl-assets/ alongside this page. The Phase 0
  setup in SKILL.md copies them there from the skill directory on first
  use. Add phase-specific CSS in the <style> block below — keep it short
  and only for rules the shared sheet doesn't cover.
-->
<title>PLACEHOLDER — task / phase</title>
<link rel="stylesheet" href=".repl-assets/style.css" />
<style>
  /* Phase-specific CSS goes here (optional). Most pages won't need any. */
</style>
</head>
<body data-task="PLACEHOLDER-task-name" data-phase="PLACEHOLDER-phase">
<div class="layout">
  <nav class="toc" aria-label="Table of contents">
    <h2>Contents</h2>
    <ol id="toc-list"><!-- auto-populated --></ol>
  </nav>
  <main>
    <header class="hero">
      <div class="crumbs">PLACEHOLDER-task-name · PLACEHOLDER-phase</div>
      <h1>PLACEHOLDER page title</h1>
      <p class="tldr">PLACEHOLDER one-paragraph TL;DR.</p>
    </header>

    <!--
      Phase-specific sections go here. Each annotatable section must follow
      this shape exactly so the widget can attach to it:

      <section class="annot" id="auth-flow" data-annot-id="auth-flow">
        <h2>Authentication flow</h2>
        ...content...
      </section>
    -->

  </main>
</div>

<div class="toolbar" role="region" aria-label="Annotation toolbar">
  <span class="count" id="annot-count">0 notes</span>
  <button type="button" class="btn" id="annot-clear" title="Clear all notes on this page">Clear</button>
  <button type="button" class="btn primary" id="annot-export">Export annotations</button>
</div>

<script src=".repl-assets/annotations.js"></script>
</body>
</html>
