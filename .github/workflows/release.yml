name: Validate and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON syntax
        run: |
          echo "Validating marketplace.json..."
          jq . .claude-plugin/marketplace.json > /dev/null
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "Validating $manifest..."
            jq . "$manifest" > /dev/null
          done

      - name: Validate plugin/marketplace alignment
        run: |
          jq -c '.plugins[]' .claude-plugin/marketplace.json | while read -r entry; do
            NAME=$(printf '%s' "$entry" | jq -r '.name')
            SOURCE=$(printf '%s' "$entry" | jq -r '.source')
            MARKET_VERSION=$(printf '%s' "$entry" | jq -r '.version')
            MANIFEST="${SOURCE#./}/.claude-plugin/plugin.json"

            if [ ! -f "$MANIFEST" ]; then
              echo "ERROR: $MANIFEST not found for marketplace plugin '$NAME'"
              exit 1
            fi

            PLUGIN_NAME=$(jq -r '.name' "$MANIFEST")
            PLUGIN_VERSION=$(jq -r '.version' "$MANIFEST")

            if [ "$PLUGIN_NAME" != "$NAME" ]; then
              echo "ERROR: name mismatch for '$NAME'"
              echo "  marketplace.json: $NAME"
              echo "  $MANIFEST: $PLUGIN_NAME"
              exit 1
            fi

            if [ "$PLUGIN_VERSION" != "$MARKET_VERSION" ]; then
              echo "ERROR: version mismatch for '$NAME'"
              echo "  $MANIFEST: $PLUGIN_VERSION"
              echo "  marketplace.json: $MARKET_VERSION"
              exit 1
            fi
            echo "OK: $NAME @ $PLUGIN_VERSION"
          done

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            NAME=$(jq -r '.name' "$manifest")
            LISTED=$(jq -r --arg n "$NAME" \
              '.plugins[] | select(.name == $n) | .name' \
              .claude-plugin/marketplace.json)
            if [ -z "$LISTED" ]; then
              echo "ERROR: plugin '$NAME' ($manifest) not listed in marketplace.json"
              exit 1
            fi
          done

      - name: Validate the shared version
        run: |
          GLOBAL_VERSION=""
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            VERSION=$(jq -r '.version' "$manifest")
            if [ -z "$GLOBAL_VERSION" ]; then
              GLOBAL_VERSION="$VERSION"
            elif [ "$VERSION" != "$GLOBAL_VERSION" ]; then
              echo "ERROR: every plugin must carry the same version"
              echo "  $manifest: $VERSION"
              echo "  expected: $GLOBAL_VERSION"
              exit 1
            fi
          done
          echo "OK: all plugins at $GLOBAL_VERSION"

      - name: Validate skill references
        run: |
          echo "Checking skill folders..."
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin_root=$(dirname "$(dirname "$manifest")")
            jq -r '.skills[]' "$manifest" | while read -r source; do
              clean_source="${source#./}"
              file="${plugin_root}/${clean_source}/SKILL.md"
              if [ ! -f "$file" ]; then
                echo "ERROR: Missing SKILL.md: $file"
                exit 1
              fi
              echo "OK: $file"
            done
          done

      - name: Validate YAML frontmatter
        run: |
          echo "Checking YAML frontmatter in skills..."
          find plugins/*/skills -name "SKILL.md" | while read -r file; do
            if ! head -1 "$file" | grep -q "^---$"; then
              echo "ERROR: Missing YAML frontmatter in $file"
              exit 1
            fi
            frontmatter=$(awk '/^---$/{c++; next} c==1' "$file")
            if [ -z "$frontmatter" ]; then
              echo "ERROR: Empty or unterminated YAML frontmatter in $file"
              exit 1
            fi
            if ! printf '%s\n' "$frontmatter" | grep -q "^name:"; then
              echo "ERROR: Missing 'name' in $file frontmatter"
              exit 1
            fi
            if ! printf '%s\n' "$frontmatter" | grep -q "^description:"; then
              echo "ERROR: Missing 'description' in $file frontmatter"
              exit 1
            fi
            dir_name=$(basename "$(dirname "$file")")
            skill_name=$(printf '%s\n' "$frontmatter" | grep -m1 "^name:" | sed 's/^name: *//')
            if [ "$dir_name" != "$skill_name" ]; then
              echo "ERROR: directory name '$dir_name' does not match skill name '$skill_name' in $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Validate the shared STE rules block
        run: |
          echo "Checking that both STE styles carry the same rules..."
          STYLES=plugins/behavior/output-styles
          PLAIN=$STYLES/simplified-technical-english.md
          INSIGHTS=$STYLES/simplified-technical-english-with-insights.md

          # Both files are read verbatim into the system prompt, so a rule edited
          # in one and missed in the other leaves the two flavors enforcing
          # different rules with nothing to report it. `## The rules` and
          # `## Do not lose the answer` are byte-identical by design, so both are
          # compared. `## Scope` is deliberately not identical — the insights
          # style names insight blocks — so it stays out of this check rather
          # than needing an allowlist that goes stale on its own.
          for style in "$PLAIN" "$INSIGHTS"; do
            if [ ! -f "$style" ]; then
              echo "ERROR: $style not found — a style was renamed or removed"
              echo "  update the paths in this step to match"
              exit 1
            fi
          done

          # `## The rules` runs to the next heading, which differs per file.
          sed -n '/^## The rules/,/^## Do not lose the answer$/p' "$PLAIN" \
            | sed '$d' > /tmp/ste-rules-plain.txt
          sed -n '/^## The rules/,/^## Insights$/p' "$INSIGHTS" \
            | sed '$d' > /tmp/ste-rules-insights.txt

          # `## Do not lose the answer` is the last section of both files.
          sed -n '/^## Do not lose the answer/,$p' "$PLAIN" > /tmp/ste-tail-plain.txt
          sed -n '/^## Do not lose the answer/,$p' "$INSIGHTS" > /tmp/ste-tail-insights.txt

          # Every read is checked before any diff runs, for two reasons. An
          # extraction that came back empty means a heading was renamed, and
          # diffing nothing against nothing would pass and leave the check
          # covering nothing. And a closing heading renamed in ONE file makes
          # that file's rules range run to end-of-file — non-empty, so the rules
          # diff would fire first and blame a rule change for what is really a
          # rename. Guarding all four reads up front reports the real cause.
          for pair in 'rules:the rules block' 'tail:the closing section'; do
            key=${pair%%:*}
            what=${pair#*:}
            if [ ! -s "/tmp/ste-$key-plain.txt" ] || [ ! -s "/tmp/ste-$key-insights.txt" ]; then
              echo "ERROR: could not read $what from both styles"
              echo "  a heading was renamed, so this check reads nothing — fix"
              echo "  the section names in this step to match the files"
              exit 1
            fi
          done

          # The empty test above catches a renamed OPENING heading. This catches a
          # renamed CLOSING one, which does not produce an empty block — the sed
          # range simply runs to end-of-file and swallows the sections after it.
          # That looks like a divergence, so without this the error would blame a
          # rule change for what is really a rename. A correctly bounded block
          # holds exactly one `## ` heading: its own. `|| true` keeps a zero count
          # from tripping `-e` through the command substitution.
          for pair in 'rules:the rules block' 'tail:the closing section'; do
            key=${pair%%:*}
            what=${pair#*:}
            for side in plain insights; do
              found=$(grep -c '^## ' "/tmp/ste-$key-$side.txt" || true)
              if [ "$found" -ne 1 ]; then
                echo "ERROR: $what spans $found headings in the $side style, expected 1"
                echo "  a closing heading was renamed, so the section ran past its"
                echo "  own end — fix the section names in this step to match"
                exit 1
              fi
            done
          done

          for pair in 'rules:the rules block' 'tail:the closing section'; do
            key=${pair%%:*}
            what=${pair#*:}
            if ! diff -u "/tmp/ste-$key-plain.txt" "/tmp/ste-$key-insights.txt"; then
              echo "ERROR: $what diverged between the two STE styles"
              echo "  apply the edit to both files, or move the intended"
              echo "  difference into a section this check does not cover"
              exit 1
            fi
            echo "OK: $what matches"
          done

      - name: Summary
        run: |
          echo "=== Marketplace Summary ==="
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "Plugin: $(jq -r '.name' "$manifest") @ $(jq -r '.version' "$manifest") ($(jq '.skills | length' "$manifest") skills)"
          done

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tag matches the shared version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION does not match the plugin version $VERSION"
            exit 1
          fi
          echo "OK: tag v$TAG_VERSION matches every plugin"

      - name: Generate release notes
        run: |
          MARKET_NAME=$(jq -r '.name' .claude-plugin/marketplace.json)
          VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)

          cat > notes.md << HEADER
          ## What's in this release

          Every plugin ships at **$VERSION** — they share one version, so a
          release moves all of them whether or not each one changed.

          HEADER

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin_root=$(dirname "$(dirname "$manifest")")
            PLUGIN_NAME=$(jq -r '.name' "$manifest")
            SKILLS=$(jq '.skills | length' "$manifest")

            echo "### \`$PLUGIN_NAME\` ($SKILLS skills)" >> notes.md
            echo "" >> notes.md
            jq -r '.skills[]' "$manifest" | while read -r source; do
              clean_source="${source#./}"
              file="${plugin_root}/${clean_source}/SKILL.md"
              if [ -f "$file" ]; then
                frontmatter=$(awk '/^---$/{c++; next} c==1' "$file")
                skill_name=$(printf '%s\n' "$frontmatter" | grep -m1 "^name:" | sed 's/^name: *//')
                skill_desc=$(printf '%s\n' "$frontmatter" | awk '/^description:/{v=$0;sub(/^description:[ \t]*/,"",v);if(v~/^[|>][0-9+-]*[ \t]*$/)v="";d=v;f=1;next} f&&/^[^ \t]/{f=0} f{s=$0;sub(/^[ \t]+/,"",s);if(s!="")d=(d==""?s:d" "s)} END{print d}' | head -c 200)
                echo "- \`$skill_name\`: ${skill_desc}" >> notes.md
              fi
            done
            echo "" >> notes.md
          done

          cat >> notes.md << INSTALL
          ## Installation

          Run these inside Claude Code:

          \`\`\`text
          /plugin marketplace add $GITHUB_REPOSITORY
          INSTALL

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo "/plugin install $(jq -r '.name' "$manifest")@$MARKET_NAME" >> notes.md
          done

          cat >> notes.md << 'FOOT'
          ```

          Install only the plugins you want — they toggle independently.
          FOOT

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "" >> notes.md
            echo "## Changes since $PREV_TAG" >> notes.md
            echo "" >> notes.md
            git log --oneline "$PREV_TAG"..HEAD >> notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: notes.md
          generate_release_notes: false
